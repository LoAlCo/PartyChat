name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets you upload just PartyChat.zip from your phone instead of every file.
      - name: Unpack project zip (if uploaded)
        run: |
          if [ -f PartyChat.zip ]; then unzip -o -q PartyChat.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PartyChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PartyChat-apk
          path: PartyChat.apk

      # A "latest" release gives you a direct .apk download link on your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Party Chat (latest build)
          prerelease: true
          files: PartyChat.apk
